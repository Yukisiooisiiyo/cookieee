<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>クッキーレジメインメニュー</title>

<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont,"Hiragino Sans","Yu Gothic", sans-serif;
    background-color: #d1dde4;
    color:aliceblue;
    padding-bottom: 92px
}
    
header {
    background: #1e2a38;
    color: #fff;
    padding: 8px 12px 7px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

header h1 { 
    font-size: 15px;
    margin: 0; 
    font-weight: 700;
    letter-spacing: 0.02em;


}

.list {
    padding: 6px 6px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}
</style>
</head> 


<body>

<header><h1>クッキーレジメインメニュー</h1></header>

<div class="list">
  <p>ここに商品カードが並ぶ予定</p>
</div>

</body>
</html>
